<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>이서의 수선집 — 둘러보기 · 텍스토피아</title>
<meta name="description" content="폰을 돌리거나 화면을 드래그해 이서의 수선집을 360°로 둘러보세요.">
<link rel="stylesheet" href="assets/styles.css?v=6">
<script src="assets/i18n.js?v=8"></script>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='13' fill='none' stroke='%23C96F8F' stroke-width='3'/%3E%3Ccircle cx='12' cy='12' r='2' fill='%23C96F8F'/%3E%3Ccircle cx='20' cy='12' r='2' fill='%23C96F8F'/%3E%3Ccircle cx='12' cy='20' r='2' fill='%23C96F8F'/%3E%3Ccircle cx='20' cy='20' r='2' fill='%23C96F8F'/%3E%3C/svg%3E">
<style>
html,body{margin:0;height:100%;background:#1a120c;overflow:hidden;font-family:var(--font-ui,'Pretendard',sans-serif);-webkit-user-select:none;user-select:none;touch-action:none}
.rm-stage{position:fixed;inset:0;overflow:hidden;background:#241812;cursor:grab}
.rm-stage:active{cursor:grabbing}
.rm-wall{position:absolute;inset:0;background-position:center center;background-size:cover;background-repeat:no-repeat;opacity:0;will-change:transform,opacity}
/* soft edge shading so the four walls feel joined */
.rm-vin{position:fixed;inset:0;pointer-events:none;z-index:20;background:radial-gradient(115% 80% at 50% 46%,transparent 60%,rgba(26,15,8,.5) 100%)}
.rm-topfade{position:fixed;top:0;left:0;right:0;height:120px;pointer-events:none;z-index:19;background:linear-gradient(180deg,rgba(20,12,7,.42),transparent)}
.rm-botfade{position:fixed;bottom:0;left:0;right:0;height:150px;pointer-events:none;z-index:19;background:linear-gradient(0deg,rgba(20,12,7,.5),transparent)}
.mote{position:fixed;border-radius:50%;background:radial-gradient(circle,rgba(255,232,180,.85),rgba(255,232,180,0) 70%);pointer-events:none;z-index:15;animation:drift linear infinite}
@keyframes drift{0%{transform:translate(0,0);opacity:.5}50%{transform:translate(14px,-26px)}100%{transform:translate(-6px,-52px);opacity:0}}
.rm-top{position:fixed;top:0;left:0;right:0;z-index:30;display:flex;align-items:center;justify-content:space-between;padding:16px 18px}
.rm-back{display:inline-flex;align-items:center;gap:6px;color:#F3E9D8;text-decoration:none;font-size:14px;font-weight:700;background:rgba(30,20,12,.42);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.16);border-radius:20px;padding:8px 14px}
.rm-logo{color:#F3E9D8;font-family:var(--font-display,serif);font-weight:800;font-size:16px;letter-spacing:.02em;text-shadow:0 1px 8px rgba(0,0,0,.5)}
/* wall label + compass */
.rm-nav{position:fixed;left:0;right:0;bottom:30px;z-index:26;display:flex;flex-direction:column;align-items:center;gap:12px;pointer-events:none}
.rm-label{color:#F5ECDB;font-family:var(--font-display,serif);font-weight:800;font-size:19px;letter-spacing:.04em;text-shadow:0 1px 10px rgba(0,0,0,.65);opacity:.94;transition:opacity .3s ease}
.rm-dots{display:flex;gap:9px}
.rm-dots i{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.32);transition:all .3s ease}
.rm-dots i.on{background:#F0C079;transform:scale(1.35);box-shadow:0 0 10px rgba(240,192,121,.7)}
.rm-hint{position:fixed;left:0;right:0;bottom:96px;z-index:25;text-align:center;color:#EADFC8;font-size:13.5px;opacity:0;transition:opacity .6s ease;pointer-events:none;text-shadow:0 1px 6px rgba(0,0,0,.6)}
.rm-hint.show{opacity:.94}
.rm-intro{position:fixed;inset:0;z-index:40;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:28px;background:radial-gradient(85% 70% at 50% 42%,rgba(60,38,20,.34),rgba(22,13,7,.82));transition:opacity .6s ease}
.rm-intro.hide{opacity:0;pointer-events:none}
.rm-intro .k{font-size:12px;letter-spacing:.28em;color:#EDBB74;font-weight:800;text-transform:uppercase}
.rm-intro h1{font-family:var(--font-display,serif);color:#F6EDDC;font-size:clamp(30px,8vw,46px);margin:12px 0 6px;font-weight:800;text-shadow:0 2px 20px rgba(0,0,0,.5)}
.rm-intro p{color:#DCCDB2;font-size:15px;max-width:340px;line-height:1.7;margin:0 0 22px}
.rm-start{border:none;border-radius:30px;background:linear-gradient(135deg,#EDBB74,#CE9350);color:#33200e;padding:15px 30px;font-size:16px;font-weight:800;cursor:pointer;font-family:var(--font-ui,sans-serif);box-shadow:0 10px 30px -8px rgba(237,187,116,.55)}
.rm-load{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;background:#241812;color:#E9D9BC;font-size:14px;letter-spacing:.1em;transition:opacity .5s ease}
.rm-load.hide{opacity:0;pointer-events:none}
.rm-load .sp{width:26px;height:26px;border-radius:50%;border:2.5px solid rgba(237,187,116,.25);border-top-color:#EDBB74;animation:spin .8s linear infinite;margin-right:12px}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>

<div class="rm-stage" id="stage">
  <div class="rm-wall" id="w0" data-c="0"></div>
  <div class="rm-wall" id="w1" data-c="90"></div>
  <div class="rm-wall" id="w2" data-c="180"></div>
  <div class="rm-wall" id="w3" data-c="270"></div>
</div>

<div class="rm-topfade"></div>
<div class="rm-botfade"></div>
<div class="rm-vin"></div>

<div class="rm-top">
  <a class="rm-back" href="index.html" id="rmBack">‹ <span id="rmBackT">돌아가기</span></a>
  <span class="rm-logo" id="rmLogo">이서의 수선집</span>
</div>

<div class="rm-nav">
  <div class="rm-label" id="rmLabel">작업대</div>
  <div class="rm-dots" id="rmDots"><i></i><i></i><i></i><i></i></div>
</div>

<div class="rm-hint" id="rmHint">드래그하거나 폰을 돌려 둘러보세요</div>

<div class="rm-load" id="rmLoad"><span class="sp"></span><span id="loadT">수선집을 여는 중…</span></div>

<div class="rm-intro" id="rmIntro">
  <div class="k">TEXTOPIA</div>
  <h1 id="introH">이서의 수선집</h1>
  <p id="introP">햇살 든 오전의 수선집. 폰을 돌리거나 화면을 드래그해, 이서의 방을 360°로 천천히 둘러보세요.</p>
  <button class="rm-start" id="rmStart">둘러보기 시작</button>
</div>

<script src="assets/app.js?v=8"></script>
<script>
(function(){
  var lang=((window.txLang||document.documentElement.lang||'ko')+'').slice(0,2); if(lang!=='ko') lang='en';
  var WALLS=[
    {img:'assets/room-01.jpg', ko:'작업대', en:'The Worktable'},
    {img:'assets/room-02.jpg', ko:'창가',   en:'By the Window'},
    {img:'assets/room-03.jpg', ko:'선반',   en:'The Shelves'},
    {img:'assets/room-04.jpg', ko:'문가',   en:'The Doorway'}
  ];
  var T={ko:{back:'돌아가기',logo:'이서의 수선집',introH:'이서의 수선집',
             introP:'햇살 든 오전의 수선집. 폰을 돌리거나 화면을 드래그해, 이서의 방을 360°로 천천히 둘러보세요.',
             start:'둘러보기 시작',load:'수선집을 여는 중…',
             hintTilt:'폰을 돌리거나 드래그해 둘러보세요',hintDrag:'화면을 드래그해 둘러보세요'},
          en:{back:'Back',logo:"The Mender's Atelier",introH:"The Mender's Atelier",
             introP:'A sunlit morning in the atelier. Turn your phone or drag the screen to look all the way around Iseo’s room.',
             start:'Start looking around',load:'Opening the atelier…',
             hintTilt:'Turn your phone or drag to look around',hintDrag:'Drag to look around'}}[lang];
  function s(id,v){var e=document.getElementById(id);if(e)e.textContent=v;}
  s('rmBackT',T.back);s('rmLogo',T.logo);s('introH',T.introH);s('introP',T.introP);s('rmStart',T.start);s('loadT',T.load);

  var wallEls=[document.getElementById('w0'),document.getElementById('w1'),document.getElementById('w2'),document.getElementById('w3')];
  for(var i=0;i<4;i++){ wallEls[i].style.backgroundImage="url('"+WALLS[i].img+"')"; }

  // ---- preload ----
  var loaded=0, load=document.getElementById('rmLoad');
  WALLS.forEach(function(w){ var im=new Image(); im.onload=im.onerror=function(){ if(++loaded>=4){ load.classList.add('hide'); setTimeout(function(){load.style.display='none';},500); } }; im.src=w.img; });
  setTimeout(function(){ load.classList.add('hide'); }, 6000); // safety

  function clamp(v,a,b){return v<a?a:v>b?b:v;}
  function ang(a){ a=a%360; if(a>180)a-=360; if(a<-180)a+=360; return a; }

  // Geometry: a landscape image on a tall phone is cropped hard by `cover`,
  // leaving a wide hidden strip. We pan across that whole strip as you turn,
  // so a ~90° turn sweeps the full wall (real "look around" feel).
  var SC=1.06, imgR=1600/1066;
  var W,H,spareX,spareY,PANK,ky;
  function geom(){ W=innerWidth; H=innerHeight;
    var dispW=Math.max(W,H*imgR)*SC, dispH=Math.max(H,W/imgR)*SC;
    spareX=(dispW-W)/2; spareY=(dispH-H)/2;
    PANK=(spareX*0.9)/45;      // px of horizontal pan per degree of turn
    ky=spareY*0.9;             // px of vertical pan at full pitch
  }
  geom(); addEventListener('resize',geom);
  var heading=0, pitch=0;            // rendered
  var tHeading=0, tPitch=0;          // target
  var lastLabel=-1, label=document.getElementById('rmLabel'), dots=document.getElementById('rmDots').children;

  function render(){
    heading += ang(tHeading-heading)*0.12;
    pitch  += (tPitch-pitch)*0.12;
    var best=-1, bestOp=-1;
    for(var i=0;i<4;i++){
      var d=ang(heading - i*90);
      var ad=Math.abs(d);
      var op = ad>=58 ? 0 : ad<=32 ? 1 : (58-ad)/26;
      var el=wallEls[i];
      if(op<=0){ if(el.style.opacity!=='0'){el.style.opacity='0';} continue; }
      var tx=-d*PANK; if(tx>spareX)tx=spareX; else if(tx<-spareX)tx=-spareX;
      var ty=pitch*ky;
      el.style.transform='translate3d('+tx.toFixed(1)+'px,'+ty.toFixed(1)+'px,0) scale('+SC+')';
      el.style.opacity=op.toFixed(3);
      el.style.zIndex=Math.round(op*10);
      if(op>bestOp){bestOp=op;best=i;}
    }
    if(best!==lastLabel && best>=0){
      lastLabel=best;
      label.style.opacity='0';
      setTimeout(function(){ label.textContent=WALLS[best][lang]; label.style.opacity='.94'; },160);
      for(var j=0;j<4;j++){ dots[j].className = j===best?'on':''; }
    }
    requestAnimationFrame(render);
  }
  requestAnimationFrame(render);

  // ---- gyroscope (relative accumulation) ----
  var orientOn=false, lastA=null, baseB=null;
  function onOrient(e){
    if(e.alpha==null && e.beta==null) return;
    orientOn=true;
    if(e.alpha!=null){
      if(lastA!=null){ var dA=ang(e.alpha-lastA); tHeading -= dA; }
      lastA=e.alpha;
    }
    if(e.beta!=null){
      if(baseB==null) baseB=e.beta;
      tPitch = clamp((e.beta-baseB)/34, -1, 1);
    }
  }

  // ---- drag (universal) ----
  var stage=document.getElementById('stage'), dragging=false, px,py, bH,bP;
  stage.addEventListener('pointerdown',function(e){ dragging=true; px=e.clientX; py=e.clientY; bH=tHeading; bP=tPitch; stage.setPointerCapture&&stage.setPointerCapture(e.pointerId); });
  stage.addEventListener('pointermove',function(e){ if(!dragging)return; tHeading = bH - (e.clientX-px)*0.30; tPitch = clamp(bP + (e.clientY-py)*0.0045, -1, 1); });
  function endDrag(){dragging=false;} stage.addEventListener('pointerup',endDrag); stage.addEventListener('pointercancel',endDrag);

  // ---- intro / permission ----
  var intro=document.getElementById('rmIntro'), hint=document.getElementById('rmHint');
  function showHint(){ hint.classList.add('show'); setTimeout(function(){hint.classList.remove('show');},4200); }
  function begin(){
    intro.classList.add('hide'); setTimeout(function(){intro.style.display='none';},600);
    if(typeof DeviceOrientationEvent!=='undefined' && typeof DeviceOrientationEvent.requestPermission==='function'){
      DeviceOrientationEvent.requestPermission().then(function(p){
        if(p==='granted'){ lastA=null; baseB=null; window.addEventListener('deviceorientation',onOrient); hint.textContent=T.hintTilt; }
        else { hint.textContent=T.hintDrag; }
        showHint();
      }).catch(function(){ hint.textContent=T.hintDrag; showHint(); });
    } else if('DeviceOrientationEvent' in window){
      window.addEventListener('deviceorientation',onOrient); hint.textContent=T.hintTilt; showHint();
    } else { hint.textContent=T.hintDrag; showHint(); }
    if(window.txEvent) txEvent('room_enter',{});
  }
  document.getElementById('rmStart').addEventListener('click',begin);

  // ---- dust motes ----
  var stg=document.getElementById('stage');
  for(var m=0;m<12;m++){ var dv=document.createElement('div'); dv.className='mote'; var sz=2+Math.round(Math.random()*3);
    dv.style.width=sz+'px'; dv.style.height=sz+'px'; dv.style.left=(Math.random()*100)+'%'; dv.style.top=(24+Math.random()*60)+'%';
    dv.style.animationDuration=(8+Math.random()*8)+'s'; dv.style.animationDelay=(-Math.random()*10)+'s'; dv.style.opacity=(0.25+Math.random()*0.45); stg.appendChild(dv); }
})();
</script>
</body>
</html>
