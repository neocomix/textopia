  function onOrient(e){ if(e.gamma==null&&e.beta==null)return; orientOn=true;
    var gx=clamp((e.gamma||0),-32,32)/32, gy=clamp(((e.beta||42)-42),-22,22)/22;
    target.x=gx*MAX; target.y=gy*MAX*0.55; }
  var dragging=false,px,py,bx,by, stage=document.getElementById('stage');
  stage.addEventListener('pointerdown',function(e){dragging=true;px=e.clientX;py=e.clientY;bx=target.x;by=target.y;});
  stage.addEventListener('pointermove',function(e){ if(!dragging)return; target.x=clamp(bx-(e.clientX-px)*0.7,-MAX,MAX); target.y=clamp(by-(e.clientY-py)*0.7,-MAX,MAX); });
  function endDrag(){dragging=false;} stage.addEventListener('pointerup',endDrag); stage.addEventListener('pointercancel',endDrag);
  window.addEventListener('mousemove',function(e){ if(dragging||orientOn)return; if(matchMedia('(pointer:fine)').matches){ var nx=(e.clientX/innerWidth-.5)*2, ny=(e.clientY/innerHeight-.5)*2; target.x=nx*MAX*0.7; target.y=ny*MAX*0.5; } });

  var intro=document.getElementById('rmIntro'), hint=document.getElementById('rmHint');
  function showHint(){ hint.classList.add('show'); setTimeout(function(){hint.classList.remove('show');},3600); }
  function begin(){ intro.classList.add('hide'); setTimeout(function(){intro.style.display='none';},600);
    if(typeof DeviceOrientationEvent!=='undefined' && typeof DeviceOrientationEvent.requestPermission==='function'){
      DeviceOrientationEvent.requestPermission().then(function(p){ if(p==='granted'){ window.addEventListener('deviceorientation',onOrient); hint.textContent=T.hintTilt; } else { hint.textContent=T.hintDrag; } showHint(); }).catch(function(){ hint.textContent=T.hintDrag; showHint(); });
    } else if('DeviceOrientationEvent' in window){ window.addEventListener('deviceorientation',onOrient); hint.textContent=T.hintTilt; showHint(); }
    else { hint.textContent=T.hintDrag; showHint(); }
    if(window.txEvent) txEvent('room_enter',{});
  }
  document.getElementById('rmStart').addEventListener('click',begin);

  var stg=document.getElementById('stage');
  for(var m=0;m<14;m++){ var d=document.createElement('div'); d.className='mote'; var sz=2+Math.round(Math.random()*4);
    d.style.width=sz+'px'; d.style.height=sz+'px'; d.style.left=(Math.random()*100)+'%'; d.style.top=(28+Math.random()*66)+'%';
    d.style.animationDuration=(7+Math.random()*8)+'s'; d.style.animationDelay=(-Math.random()*10)+'s'; d.style.opacity=(0.3+Math.random()*0.5); stg.appendChild(d); }
})();
</script>
