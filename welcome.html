<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>실이 이어졌어요 — 텍스토피아</title>
<link rel="stylesheet" href="assets/styles.css?v=6">
<script src="assets/i18n.js?v=8"></script>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='13' fill='none' stroke='%23C96F8F' stroke-width='3'/%3E%3Ccircle cx='12' cy='12' r='2' fill='%23C96F8F'/%3E%3Ccircle cx='20' cy='12' r='2' fill='%23C96F8F'/%3E%3Ccircle cx='12' cy='20' r='2' fill='%23C96F8F'/%3E%3Ccircle cx='20' cy='20' r='2' fill='%23C96F8F'/%3E%3C/svg%3E">
<style>
html,body{margin:0;height:100%;font-family:var(--font-ui,'Pretendard',sans-serif);overflow:hidden}
.wel{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:28px;
  background:radial-gradient(90% 70% at 50% 36%,#3a2714,#20130a 78%)}
.wel.enter{animation:reveal 1.1s ease both}
@keyframes reveal{0%{opacity:0;transform:scale(1.04);filter:brightness(2)}100%{opacity:1;transform:none;filter:none}}
.spool-img{width:166px;height:auto;border-radius:16px;margin-bottom:20px;
  box-shadow:0 14px 34px rgba(0,0,0,.5), 0 0 0 1px rgba(240,192,121,.3)}
.eyebrow{font-size:11px;letter-spacing:.32em;color:#F0C079;font-weight:800;text-transform:uppercase}
h1{font-family:var(--font-display,serif);color:#F7EEDD;font-size:clamp(26px,7vw,38px);font-weight:800;margin:12px 0 8px}
p{color:#DCCDB2;font-size:15px;line-height:1.7;max-width:340px;margin:0 0 6px}
.email{color:#F0C079;font-weight:700;font-size:13.5px;margin:4px 0 22px;word-break:break-all}
.btn{border:none;border-radius:30px;background:linear-gradient(135deg,#EDBB74,#CE9350);color:#33200e;padding:15px 30px;font-size:16px;font-weight:800;cursor:pointer;font-family:inherit;box-shadow:0 10px 30px -8px rgba(237,187,116,.5);text-decoration:none;display:inline-block}
.sub-link{display:block;margin-top:18px;color:#C7B79B;font-size:12.5px}
.sub-link a{color:#E7D3AC;text-decoration:none;border-bottom:1px solid rgba(231,211,172,.35);cursor:pointer}
.err h1{color:#F2E4CE}
</style>
</head>
<body>
<div class="wel" id="wel">
  <img class="spool-img" src="assets/my-thread.jpg?v=1" alt="나의 실" id="emblem">

  <div class="eyebrow">TEXTOPIA</div>
  <h1 id="wTitle">실이 이어졌어요</h1>
  <p id="wSub">당신의 실이 이 세계의 천에 이어졌어요.<br>이제 수선집은 언제든 당신을 기억합니다.</p>
  <div class="email" id="wEmail"></div>
  <a class="btn" id="wBtn" href="index.html">수선집으로 들어가기 →</a>
  <div class="sub-link" id="wAlt"></div>
</div>

<script src="assets/supabase.js?v=1"></script>
<script>
(function(){
  var lang=((window.txLang||document.documentElement.lang||'ko')+'').slice(0,2); if(lang!=='ko') lang='en';
  var SB_URL='https://hoqbklxewyziancqpdwv.supabase.co';
  var SB_KEY='sb_publishable_Nctbwra5wJWT9J1JeSt_WA_6kEd2y6e';
  var T={ko:{title:'실이 이어졌어요',sub:'당신의 실이 이 세계의 천에 이어졌어요.<br>이제 수선집은 언제든 당신을 기억합니다.',
        btn:'수선집으로 들어가기 →',logout:'로그아웃',
        eTitle:'관문이 아직 열리지 않았어요',eSub:'실이 만료됐거나 링크가 어긋났어요. 다시 한 번 실을 이어 주세요.',eBtn:'관문으로 돌아가기 →'},
      en:{title:'Your thread is tied',sub:"Your thread is now woven into this world's fabric.<br>The atelier will remember you from now on.",
        btn:'Enter the atelier →',logout:'Sign out',
        eTitle:'The seam has not opened yet',eSub:'The thread may have expired or the link slipped. Please tie your thread again.',eBtn:'Back to the gateway →'}}[lang];
  document.documentElement.lang=lang;
  var wel=document.getElementById('wel'), title=document.getElementById('wTitle'), sub=document.getElementById('wSub'),
      em=document.getElementById('wEmail'), btn=document.getElementById('wBtn'), alt=document.getElementById('wAlt');
  title.textContent=T.title; sub.innerHTML=T.sub;

  var sb=null;
  try{ if(window.supabase&&window.supabase.createClient){ sb=window.supabase.createClient(SB_URL,SB_KEY,{auth:{persistSession:true,detectSessionInUrl:true}}); } }catch(e){}
  function showError(){ wel.classList.add('err'); title.textContent=T.eTitle; sub.innerHTML=T.eSub;
    btn.textContent=T.eBtn; btn.setAttribute('href','login.html'); em.textContent=''; }
  function showOK(user){ wel.classList.add('enter');
    if(user&&user.email) em.textContent=user.email;
    alt.innerHTML='<a id="wLogout">'+T.logout+'</a>';
    var lo=document.getElementById('wLogout');
    if(lo) lo.addEventListener('click',function(){ if(sb) sb.auth.signOut().then(function(){ location.href='login.html'; }); });
    if(window.txEvent) txEvent('auth_entered',{});
  }
  if(!sb){ showError(); return; }
  // give supabase a moment to parse the URL hash, then check
  setTimeout(function(){
    sb.auth.getSession().then(function(r){
      var sess=r&&r.data?r.data.session:null;
      if(sess&&sess.user){ showOK(sess.user); }
      else { showError(); }
    }).catch(showError);
  }, 400);
})();
</script>
</body>
</html>
