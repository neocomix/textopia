<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>텍스토피아로 들어가기 — 관문</title>
<meta name="description" content="당신의 실을 이어, 텍스토피아로 들어오세요.">
<link rel="stylesheet" href="assets/styles.css?v=6">
<script src="assets/i18n.js?v=8"></script>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='13' fill='none' stroke='%23C96F8F' stroke-width='3'/%3E%3Ccircle cx='12' cy='12' r='2' fill='%23C96F8F'/%3E%3Ccircle cx='20' cy='12' r='2' fill='%23C96F8F'/%3E%3Ccircle cx='12' cy='20' r='2' fill='%23C96F8F'/%3E%3Ccircle cx='20' cy='20' r='2' fill='%23C96F8F'/%3E%3C/svg%3E">
<style>
html,body{margin:0;height:100%;background:#160d08;overflow:hidden;font-family:var(--font-ui,'Pretendard',sans-serif);-webkit-user-select:none;user-select:none}
.gate{position:fixed;inset:0;overflow:hidden;background:#160d08}
.gate-bg{position:absolute;inset:0;background:url('assets/gateway.jpg') center/cover no-repeat;background-color:#160d08}
@media (min-aspect-ratio:1/1){ .gate-bg{background-size:contain} }
.gate-bloom{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);width:min(62vw,320px);height:min(84vh,560px);
  background:radial-gradient(50% 50% at 50% 50%,rgba(255,224,150,.42),rgba(255,206,150,.12) 55%,transparent 72%);
  pointer-events:none;mix-blend-mode:screen;opacity:.6;transition:opacity 1.1s ease;animation:breathe 6s ease-in-out infinite}
.gate-bloom.hot{opacity:1}
@keyframes breathe{0%,100%{opacity:.5}50%{opacity:.78}}
.gate-top{position:fixed;top:0;left:0;right:0;z-index:10;display:flex;align-items:center;justify-content:space-between;padding:16px 18px;background:linear-gradient(180deg,rgba(12,7,4,.6),transparent)}
.gate-back{display:inline-flex;align-items:center;gap:6px;color:#F0E4D0;text-decoration:none;font-size:14px;font-weight:700;background:rgba(30,20,12,.4);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.14);border-radius:20px;padding:8px 14px}
.gate-brand{color:#F0E4D0;font-family:var(--font-display,serif);font-weight:800;font-size:15px;letter-spacing:.03em;opacity:.9;text-shadow:0 1px 8px rgba(0,0,0,.6)}
/* content column */
.gate-wrap{position:fixed;inset:0;z-index:8;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding:0 22px calc(env(safe-area-inset-bottom,0) + 46px);text-align:center}
.gate-eyebrow{font-size:11px;letter-spacing:.32em;color:#F0C079;font-weight:800;text-transform:uppercase;margin-bottom:10px;text-shadow:0 1px 10px rgba(0,0,0,.7)}
.gate-title{font-family:var(--font-display,serif);color:#F7EEDD;font-size:clamp(25px,7vw,36px);font-weight:800;margin:0 0 8px;text-shadow:0 2px 22px rgba(0,0,0,.7)}
.gate-sub{color:#E4D6BE;font-size:14px;line-height:1.7;max-width:340px;margin:0 0 22px;text-shadow:0 1px 10px rgba(0,0,0,.7)}
.gate-form{width:100%;max-width:360px}
.gate-field{display:flex;gap:8px;background:rgba(24,15,9,.5);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid rgba(240,192,121,.4);border-radius:16px;padding:7px 7px 7px 16px;transition:border-color .3s ease,box-shadow .3s ease}
.gate-field:focus-within{border-color:rgba(240,192,121,.9);box-shadow:0 0 26px -6px rgba(240,192,121,.55)}
.gate-field input{flex:1;background:transparent;border:none;outline:none;color:#F7EEDD;font-size:15.5px;font-family:inherit;min-width:0}
.gate-field input::placeholder{color:#B9A587}
.gate-btn{border:none;border-radius:12px;background:linear-gradient(135deg,#EDBB74,#CE9350);color:#33200e;padding:0 18px;height:44px;font-size:15px;font-weight:800;cursor:pointer;font-family:inherit;white-space:nowrap;transition:transform .15s ease,opacity .2s}
.gate-btn:active{transform:scale(.96)} .gate-btn[disabled]{opacity:.6;cursor:default}
.gate-msg{min-height:20px;margin-top:14px;font-size:13.5px;line-height:1.6;color:#E9DcC2;text-shadow:0 1px 8px rgba(0,0,0,.7)}
.gate-msg.ok{color:#F3D79A} .gate-msg.err{color:#F0A98A}
.gate-alt{margin-top:18px;color:#C7B79B;font-size:12.5px;text-shadow:0 1px 8px rgba(0,0,0,.7)}
.gate-alt a{color:#F0C079;text-decoration:none;border-bottom:1px solid rgba(240,192,121,.4)}
/* success shimmer */
.gate-sent .gate-field, .gate-sent .gate-alt{display:none}
.thread{position:fixed;border-radius:50%;background:radial-gradient(circle,rgba(255,230,170,.9),transparent 70%);pointer-events:none;z-index:6;animation:rise linear infinite}
@keyframes rise{0%{transform:translateY(0);opacity:0}20%{opacity:.7}100%{transform:translateY(-120px);opacity:0}}
/* pass-through flash (used when already authed / entering) */
.flash{position:fixed;inset:0;z-index:60;background:radial-gradient(60% 50% at 50% 45%,#fff,#F3D79A 40%,#160d08 100%);opacity:0;pointer-events:none;transition:opacity .8s ease}
.flash.on{opacity:1}
</style>
</head>
<body>
<div class="gate">
  <div class="gate-bg"></div>
  <div class="gate-bloom" id="bloom"></div>
</div>

<div class="gate-top">
  <a class="gate-back" href="index.html" id="gBack">‹ <span id="gBackT">돌아가기</span></a>
  <span class="gate-brand" id="gBrand">텍스토피아</span>
</div>

<div class="gate-wrap" id="wrap">
  <div class="gate-eyebrow">TEXTOPIA</div>
  <h1 class="gate-title" id="gTitle">텍스토피아로 들어가기</h1>
  <p class="gate-sub" id="gSub">이 세계의 천에, 당신의 실 한 올을 이어 주세요.<br>이서가 그 실을 따라 관문을 열어 드릴게요.</p>
  <form class="gate-form" id="gForm" autocomplete="on" novalidate>
    <div class="gate-field">
      <input id="gEmail" type="email" inputmode="email" autocomplete="email" placeholder="당신의 이메일 (실의 끝)">
      <button class="gate-btn" id="gBtn" type="submit">실 잇기 →</button>
    </div>
    <div class="gate-msg" id="gMsg"></div>
    <div class="gate-alt" id="gAlt">처음 오셨든, 다시 오셨든 — 같은 실 하나면 됩니다.</div>
  </form>
</div>

<div class="flash" id="flash"></div>

<script src="assets/supabase.js?v=1"></script>
<script>
(function(){
  var lang=((window.txLang||document.documentElement.lang||'ko')+'').slice(0,2); if(lang!=='ko') lang='en';
  var SB_URL='https://hoqbklxewyziancqpdwv.supabase.co';
  var SB_KEY='sb_publishable_Nctbwra5wJWT9J1JeSt_WA_6kEd2y6e';
  var T={ko:{back:'돌아가기',brand:'텍스토피아',title:'텍스토피아로 들어가기',
        sub:'이 세계의 천에, 당신의 실 한 올을 이어 주세요.<br>이서가 그 실을 따라 관문을 열어 드릴게요.',
        ph:'당신의 이메일 (실의 끝)', btn:'실 잇기 →', sending:'실을 잇는 중…',
        alt:'처음 오셨든, 다시 오셨든 — 같은 실 하나면 됩니다.',
        errFmt:'이메일 형식을 다시 확인해 주세요.',
        sent:'이서가 당신에게 실을 보냈어요. 메일함에서 그 실을 따라오시면, 관문이 열립니다. ✧',
        already:'이미 관문 안에 계세요. 안으로 모실게요…',
        fail:'실이 잠시 끊겼어요. 잠시 후 다시 시도해 주세요.'},
      en:{back:'Back',brand:'Textopia',title:'Enter Textopia',
        sub:'Tie one thread of yours into the fabric of this world.<br>Iseo will follow it and open the seam for you.',
        ph:'Your email (the end of your thread)', btn:'Tie the thread →', sending:'Tying your thread…',
        alt:'First time or returning — the same single thread is all you need.',
        errFmt:'Please check the email format.',
        sent:'Iseo has sent you a thread. Follow it from your inbox and the seam will open. ✧',
        already:'You are already within the seam. Taking you inside…',
        fail:'The thread slipped for a moment. Please try again shortly.'}}[lang];
  function setHTML(id,v){var e=document.getElementById(id);if(e)e.innerHTML=v;}
  function setTX(id,v){var e=document.getElementById(id);if(e)e.textContent=v;}
  setTX('gBackT',T.back);setTX('gBrand',T.brand);setTX('gTitle',T.title);setHTML('gSub',T.sub);
  document.getElementById('gEmail').placeholder=T.ph; setTX('gBtn',T.btn); setTX('gAlt',T.alt);
  document.documentElement.lang=lang;

  var bloom=document.getElementById('bloom'), msg=document.getElementById('gMsg'),
      form=document.getElementById('gForm'), email=document.getElementById('gEmail'),
      btn=document.getElementById('gBtn'), wrap=document.getElementById('wrap'), flash=document.getElementById('flash');

  email.addEventListener('focus',function(){ bloom.classList.add('hot'); });
  email.addEventListener('blur',function(){ if(!email.value) bloom.classList.remove('hot'); });

  var sb=null;
  try{ if(window.supabase&&window.supabase.createClient){ sb=window.supabase.createClient(SB_URL,SB_KEY,{auth:{persistSession:true,detectSessionInUrl:true}}); } }catch(e){}

  // already signed in? → gently pass through
  if(sb){ sb.auth.getSession().then(function(r){ if(r&&r.data&&r.data.session){ enterFlash(); } }); }
  function enterFlash(){ msg.className='gate-msg ok'; msg.textContent=T.already; flash.classList.add('on');
    setTimeout(function(){ location.href='welcome.html'; }, 900); }

  function riseThreads(){ for(var i=0;i<10;i++){ (function(k){ setTimeout(function(){
      var d=document.createElement('div'); d.className='thread'; var sz=3+Math.round(Math.random()*4);
      d.style.width=sz+'px'; d.style.height=sz+'px'; d.style.left=(38+Math.random()*24)+'%'; d.style.top=(40+Math.random()*22)+'%';
      d.style.animationDuration=(2.4+Math.random()*2)+'s'; document.body.appendChild(d);
      setTimeout(function(){d.remove();},4600); },k*130); })(i); } }

  form.addEventListener('submit',function(ev){
    ev.preventDefault();
    var v=(email.value||'').trim();
    if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(v)){ msg.className='gate-msg err'; msg.textContent=T.errFmt; return; }
    bloom.classList.add('hot'); btn.disabled=true; btn.textContent=T.sending; msg.className='gate-msg'; msg.textContent='';
    if(!sb){ msg.className='gate-msg err'; msg.textContent=T.fail; btn.disabled=false; btn.textContent=T.btn; return; }
    sb.auth.signInWithOtp({ email:v, options:{ emailRedirectTo: location.origin+'/welcome.html', shouldCreateUser:true } })
      .then(function(res){
        if(res.error){ throw res.error; }
        document.body.classList.add('gate-sent');
        msg.className='gate-msg ok'; msg.textContent=T.sent; riseThreads();
        if(window.txEvent) txEvent('auth_magiclink_sent',{});
      })
      .catch(function(e){ console.warn('otp',e); msg.className='gate-msg err'; msg.textContent=T.fail;
        btn.disabled=false; btn.textContent=T.btn; });
  });
})();
</script>
</body>
</html>
